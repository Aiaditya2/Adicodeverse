<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - Adi-CodeVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Adi-CodeVerse</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="editor.html">Editor</a></li>
                <li><a href="community.html" class="btn">Community</a></li>
                <li><a href="learn.html">Learn</a></li>
                <li><a href="jobs.html">Jobs</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button class="theme-toggle" onclick="toggleTheme()">🌙</button></li>
            </ul>
        </div>
    </nav>

    <!-- Community Section -->
    <section class="dashboard">
        <div class="container">
            <div class="welcome-section">
                <h1>🌍 Developer Community</h1>
                <p>Share your projects, get feedback, and connect with fellow developers!</p>
            </div>

            <!-- Create Post -->
            <div class="post-input-container">
                <h3>Create a Post</h3>
                <textarea id="postContent" class="post-textarea" placeholder="Share your thoughts, ask questions, or showcase your work..."></textarea>
                <button class="btn" onclick="addPost()">Post to Community</button>
            </div>

            <!-- Posts Feed -->
            <div id="postsContainer">
                <!-- Posts will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Adi-CodeVerse. All rights reserved.</p>
            <p>Build, Learn & Connect in One Universe 🚀</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="chatbot.js"></script>
    <script>
        // Community specific functions
        function addPost() {
            const user = checkAuth();
            if (!user) {
                showToast('Please login to post', 'error');
                return;
            }

            const content = document.getElementById('postContent').value.trim();
            if (!content) {
                showToast('Please write something to post', 'error');
                return;
            }

            const post = {
                id: Date.now(),
                content: content,
                author: user.username,
                timestamp: new Date().toISOString(),
                likes: 0,
                liked: false
            };

            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            posts.unshift(post);
            localStorage.setItem('posts', JSON.stringify(posts));

            document.getElementById('postContent').value = '';
            showToast('Post shared successfully!', 'success');
            loadPosts();
        }

        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            const container = document.getElementById('postsContainer');

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <h3>No posts yet</h3>
                        <p>Be the first to share something with the community!</p>
                    </div>
                `;
            } else {
                container.innerHTML = posts.map(post => `
                    <div class="post-item" data-post-id="${post.id}">
                        <div class="post-header">
                            <div>
                                <span class="post-author">${post.author}</span>
                                <span class="post-time">${new Date(post.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-actions">
                            <button class="like-button ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                ${post.liked ? '❤️' : '🤍'} ${post.likes}
                            </button>
                            ${post.author === JSON.parse(localStorage.getItem('adiCodeverseCurrentUser') || '{}').username ? 
                                `<button class="delete-post-btn" onclick="deletePost(${post.id})">Delete</button>` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        function toggleLike(postId) {
            const user = checkAuth();
            if (!user) {
                showToast('Please login to like posts', 'error');
                return;
            }

            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            const postIndex = posts.findIndex(p => p.id === postId);
            
            if (postIndex !== -1) {
                if (!posts[postIndex].liked) {
                    posts[postIndex].likes++;
                    posts[postIndex].liked = true;
                } else {
                    posts[postIndex].likes--;
                    posts[postIndex].liked = false;
                }
                
                localStorage.setItem('posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) {
                return;
            }

            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            const updatedPosts = posts.filter(p => p.id !== postId);
            localStorage.setItem('posts', JSON.stringify(updatedPosts));

            showToast('Post deleted successfully', 'success');
            loadPosts();
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadPosts();
        });
    </script>
</body>
</html>
